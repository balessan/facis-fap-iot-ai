name: W-Stack baseline

on:
  push:
    branches: [main, develop]
    paths:
      - "infrastructure/wstack/**"
      - ".github/workflows/wstack-baseline.yml"
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/wstack/**"
      - ".github/workflows/wstack-baseline.yml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r infrastructure/wstack/requirements.txt

      - name: Unit tests of the checks and scripts
        run: python3 -m unittest discover -s infrastructure/wstack/tests -v

      - name: Check the lock file
        run: python3 infrastructure/wstack/check-baseline.py

  registry-drift:
    # Weekly and on demand: fails when a tag on the XFSC registry no longer
    # points to the pinned digest, so the failed run notifies. The pinned
    # digests still resolve; the failure means the lock is out of date with
    # the tags, and someone should decide whether to regenerate it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Re-resolve the pinned tags
        run: python3 infrastructure/wstack/check-baseline.py --registry --strict
