name: Credential schemas

on:
  push:
    branches: [main, develop]
    paths:
      - "schemas/credentials/**"
      - ".github/workflows/credential-schemas.yml"
  pull_request:
    branches: [main]
    paths:
      - "schemas/credentials/**"
      - ".github/workflows/credential-schemas.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r schemas/credentials/tools/requirements.txt

      - name: Validate the examples against the schemas
        run: python3 schemas/credentials/tools/validate-schemas.py

      - name: Check the generated issuer metadata
        run: python3 schemas/credentials/tools/build-issuer-metadata.py --check
